# Publish go-template-js from CI: one build, two distribution channels.
#
# The npm half is the ordinary one — a version tag ships the package to
# registry.npmjs.org, and the tag is the single source of truth for "this
# commit is released" (the workflow refuses to publish when the tag and
# package.json disagree, rather than shipping a mislabeled version).
#
# The GitHub Release asset is the half that is not ordinary, and it exists for
# a concrete failure: in some corporate environments the @promptctl scope is
# unreachable through the internal npm proxy, so `pnpm install` in a consumer
# checkout (cc-candybar keeps @promptctl/go-template-js and @promptctl/rich-js
# as devDependencies) cannot resolve this package at all. Attaching the packed
# tarball to the release lets those checkouts install it straight from GitHub.
# This lifts the @promptctl scope off the registry and nothing more — the
# package's own runtime dependency (@noble/hashes) still resolves from npm, so
# the asset answers a blocked scope, not a blocked registry:
#
#   "@promptctl/go-template-js":
#     "https://github.com/promptctl/go-template-js/releases/download/vX.Y.Z/promptctl-go-template-js-X.Y.Z.tgz"
#
# Why an asset and not `github:promptctl/go-template-js#semver:^0.9.0`: a git
# dependency installs the *source* tree, which carries no dist/. Measured with
# the @promptctl scope pointed at a dead registry, that install exits 0 and
# leaves an unusable package behind — pnpm runs no build, emits no warning, and
# the failure only surfaces later as ERR_MODULE_NOT_FOUND on dist/index.js. The
# release asset is the same prebuilt tarball npm serves, so it installs in ~1s,
# needs no build-script allowlist, and cannot half-install.
#
# Publishing uses npm Trusted Publishing (OIDC): there is no NPM_TOKEN secret,
# `npm publish` exchanges this job's GitHub Actions identity for a short-lived
# credential. SETUP REQUIRED — unlike the sibling repo brandon-fryslie/rich-js,
# @promptctl/go-template-js has no trusted publisher configured yet, so this
# workflow will fail with E401 until one is added on npmjs.com (Package →
# Settings → Trusted Publisher: this repo, workflow `publish.yml`). Until then a
# tag publishes nothing anywhere, which is the intended failure: see the
# ordering note below.
#
# That trust binds THIS FILENAME and THIS REPO — renaming this file silently
# breaks publishing, and the rename must be mirrored on npmjs.com in the same
# change.
#
# Ordering: npm publish comes FIRST, the release asset second. npm is the
# canonical registry, so "version X exists" is its fact to establish; uploading
# the asset first would let a failed publish leave a GitHub Release serving a
# version npm never received, and the README promises the asset is byte-
# identical to what npm serves for that version [LAW:one-source-of-truth]. This
# ordering also makes that promise structural rather than hopeful: npm refuses
# to publish over an existing version, so the upload step cannot be reached
# twice for one version with different bytes [LAW:single-enforcer]. The cost is
# the narrow case where publish succeeds and the upload then fails — the run is
# red, and the fix is one `gh release upload <tag> <tarball> --clobber` by hand,
# because a re-run would (correctly) stop at the duplicate publish.
#
# Release procedure:
#   npm version <major|minor|patch> --no-git-tag-version   # bump on a branch
#   # PR, review, merge to master
#   git checkout master && git pull
#   tag="v$(node -p "require('./package.json').version")"
#   git tag "$tag" && git push origin "$tag"   # this tag only, never --tags

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write is for the release asset — this workflow creates the
  # GitHub Release if the tag does not already have one, and uploads to it.
  contents: write
  # Required for npm provenance and for Trusted Publishing's OIDC exchange.
  id-token: write

jobs:
  publish:
    # Same pinned image as ci.yml, for the same reason: toolchain drift under
    # `ubuntu-latest` must not silently change what gets shipped.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs here, unlike ci.yml, which uses moving
      # major tags. The difference is the blast radius: this job holds
      # `contents: write` and an `id-token: write` identity that can publish to
      # npm with no token anyone could revoke, so a compromised or retagged
      # action publishes as us. ci.yml only reads.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the tagged commit can be proved to be on master.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.0
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm CLI >= 11.5.1, which Node 20 does not
      # bundle. Pinned exactly, for the same reason the actions are: this is the
      # binary that performs the publish. Do not move this to npm 12 without
      # also moving node-version — npm 12 requires Node >= 22.22, and the
      # engines field here still targets Node 20. pnpm owns installing and
      # gating; npm owns packing and publishing, because OIDC publishing is an
      # npm CLI feature.
      - name: Pin npm for Trusted Publishing
        run: npm install -g npm@11.19.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # [LAW:no-silent-failure] A tag that disagrees with package.json is a
      # release-process bug. Fail here, before anything irreversible or
      # outward-facing has happened.
      - name: Verify tag matches package.json version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi
          # `v*` matches v1.2.3-rc.1 too, and a prerelease must not become npm's
          # `latest` or GitHub's "Latest release" — the README points readers at
          # the latest release asset. The semver prerelease field is the
          # discriminator, so both channels read it from one place here and
          # carry it forward as values [LAW:dataflow-not-control-flow].
          #
          # A stable release names neither channel's "latest", because both
          # channels already guard it against moving backwards and both guards
          # are disabled by naming it. npm gates that check on `isDefaultTag`, so
          # it holds only while --tag is absent; GitHub's `make_latest: legacy`,
          # what `gh release` sends while --latest is absent, weighs semver and
          # not merely creation date. Claim either explicitly and a v0.9.1
          # backport tagged after v0.10.0 silently demotes v0.10.0 — on the
          # channel that claimed it, and on that channel alone, which is how the
          # two come to disagree about what is current [LAW:single-enforcer].
          if [ "$pkg" != "${pkg%%-*}" ]; then
            echo "npm_tag=--tag next" >> "$GITHUB_OUTPUT"
            echo "gh_flags=--prerelease=true --latest=false" >> "$GITHUB_OUTPUT"
            echo "publishing ${pkg} as a prerelease (npm dist-tag: next)"
          else
            echo "npm_tag=" >> "$GITHUB_OUTPUT"
            echo "gh_flags=--prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publishing ${pkg} (npm and GitHub each apply their own latest)"
          fi

      # `v*` fires for a tag on ANY branch, and ci.yml does not run on tags — so
      # without this, a tag on an unmerged commit publishes having never faced
      # the full CI suite. In particular `prepublishOnly` below is lint,
      # typecheck, test and build only; it omits the conformance-fixture parity
      # check, which is ci.yml's strongest assertion. Rather than restate that
      # check here as a second gate, require the commit to be one master already
      # accepted [LAW:single-enforcer].
      - name: Verify the tagged commit is on master
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tagged commit ${GITHUB_SHA} is not an ancestor of origin/master — it has not passed CI on master"
            exit 1
          fi
          echo "${GITHUB_SHA} is on master"

      # [LAW:one-source-of-truth] The package already defines its own publish
      # gate in `prepublishOnly` (lint, typecheck, test, build). Run that script
      # by name rather than restating its steps here — publishing a pre-packed
      # tarball does not fire prepublishOnly, and a second copy of the gate in
      # YAML is a copy that drifts.
      - name: Gate
        run: pnpm run prepublishOnly

      # One artifact serves both channels: this tarball becomes the release
      # asset AND the thing npm publishes, so the two can never disagree about
      # what version X.Y.Z contains.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          tgz="$(npm pack --silent)"
          [ -s "$tgz" ] || { echo "::error::npm pack produced no tarball"; exit 1; }
          # The asset's whole purpose is carrying a prebuilt dist. Assert it,
          # rather than discovering it missing in a consumer's node_modules.
          # Both of package.json's entry points are checked: a dts emit that
          # silently stops producing declarations would otherwise ship runtime
          # code with no types, which fails in the consumer, not here.
          # Listed to a file, not piped into grep: `grep -q` exits on first
          # match, tar takes SIGPIPE, and pipefail would report that 141 as a
          # failed check — intermittently, depending on which process wins.
          tar tzf "$tgz" >"$RUNNER_TEMP/tarball-listing.txt"
          for entry in package/dist/index.js package/dist/index.d.ts; do
            grep -qx "$entry" "$RUNNER_TEMP/tarball-listing.txt" || {
              echo "::error::packed tarball contains no ${entry} — the build did not reach the tarball"
              exit 1
            }
          done
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "packed $tgz"

      # First of the two publishes — see the ordering note in the file header.
      # No NODE_AUTH_TOKEN: npm >= 11.5.1 detects the Actions OIDC environment
      # (id-token: write, above), exchanges it for a short-lived publish token,
      # and writes that over whatever credential the .npmrc held — it does not
      # inspect existing credentials first, so there is no token to remove here.
      # One consequence worth knowing when this breaks: setup-node's
      # `registry-url` leaves a literal `${NODE_AUTH_TOKEN}` in the job .npmrc,
      # which npm counts as a credential, so a misconfigured trust surfaces as a
      # bare registry E401 rather than npm's clearer ENEEDAUTH.
      - name: Publish to npm
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag }}
        run: |
          set -euo pipefail
          # $NPM_TAG is deliberately unquoted: empty for a stable release, so npm
          # keeps its implicit-tag guards (see the version step). The directive
          # has to live inside the script — shellcheck only ever sees this block,
          # so one written as a YAML comment above `run:` binds to nothing.
          # shellcheck disable=SC2086
          npm publish "$TGZ" --access public --provenance $NPM_TAG

      # Second, and only once npm has accepted the version: the release asset is
      # the same tarball, so it can only ever describe a version that exists.
      - name: Attach tarball to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          GH_FLAGS: ${{ steps.version.outputs.gh_flags }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # A tag pushed by hand has no Release yet; one cut from the GitHub UI
          # does. `view` is an existence probe here — if it fails for any other
          # reason, `create` fails loudly on the next line rather than guessing.
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          # `edit` runs on both paths, never only on create: a Release already
          # exists when the tag was cut from the UI or by `gh release create`,
          # and flags applied only on the create path are exactly the ones that
          # go missing when they matter [LAW:dataflow-not-control-flow]. The
          # create above passes no --prerelease, so an rc is momentarily a
          # stable release and legacy may hand it the badge; $GH_FLAGS carries
          # the discriminator down from the version step and settles both.
          # shellcheck disable=SC2086
          gh release edit "$tag" $GH_FLAGS
          # --clobber keeps a re-run idempotent. It cannot silently change the
          # bytes behind a URL that consumers' lockfiles pin by hash, because
          # the publish step above already refused the duplicate version and
          # this step was never reached [LAW:single-enforcer].
          gh release upload "$tag" "$TGZ" --clobber
