name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege: this workflow only reads code (checkout + setup tools)
# and reports status. It never writes back to the repo or comments on PRs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Pin the runner image so toolchain/OS upgrades to `ubuntu-latest`
    # never silently shift conformance-regen output from under us.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # The toolchain (vitest 5) needs Node >= 22.12, above the engines
      # floor; the runtime-floor job proves the floor on the built output.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Pin to a minor line: text/template is stable across patch
          # releases, and patch updates carry security fixes worth taking.
          # Bump deliberately when conformance generator behavior changes.
          go-version: '1.25'
          cache-dependency-path: conformance/gen/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The generator decides what each fixture means and what Go actually
      # said. Both are places it can be wrong in a way the corpus would
      # then enforce on the engine, and the regen step below cannot catch
      # either: it only proves regen is a no-op on a corpus that is
      # already correct.
      - name: Conformance generator tests
        run: cd conformance/gen && go test ./...

      # Conformance fixtures are byte-for-byte Go-reference outputs.
      # `pnpm conformance:regen` is supposed to be a no-op on a fresh
      # tree; if it isn't, something drifted. Asserting tree-cleanliness
      # is the strongest theorem — it catches modified expected.txt
      # (template edits not regen'd), untracked expected.txt (new
      # fixtures committed without regen'ing), and tracked drift in
      # `conformance/gen/` (e.g. go.sum updates from `go run`). A scoped
      # `git diff --exit-code` would miss the untracked case entirely.
      - name: Conformance fixture parity
        run: |
          pnpm conformance:regen
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Conformance regen produced a dirty tree — fixtures or generator state drifted from Go reference."
            git status --short
            git diff
            exit 1
          fi

  # engines.node promises Node 20.19, which the toolchain no longer runs on.
  # Build on a toolchain Node, then load and run the shipped dist on the floor.
  runtime-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (toolchain)
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Setup Node (engines floor)
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Run dist on the floor
        run: |
          node --version
          node --input-type=module -e '
            import { createEngine, sprigHash, sprigStrings } from "./dist/index.js";
            const engine = createEngine({ fromString: (s) => s, funcs: { ...sprigStrings(), ...sprigHash() } });
            const out = engine.parse("{{ .name | upper }} {{ sha256sum .name }}").evaluate({ name: "ada" }).join("");
            const want = "ADA fdee430d40bd57deeac186cd9790033d0f06f909a8806e7ce6e717ab7c7d5029";
            if (out !== want) { console.error(`got  ${out}\nwant ${want}`); process.exit(1); }
            console.log(out);
          '
